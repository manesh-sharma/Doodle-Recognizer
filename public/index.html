<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doodle — Ready, Set, Doodle!</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <!-- HOME -->
    <section id="home" class="screen active">
      <div class="home-card">
        <div class="corner-star">✦</div>
        <div class="top-buttons">
          <button onclick="showScreen('login')">Login</button>
          <button onclick="showScreen('signup')">Sign Up</button>
          <button onclick="showScreen('age')">About Us</button>
        </div>

        <div class="home-content">
          <div class="doodle-label">Doodle</div>
          <h1>Ready, Set,<br>Doodle!!!</h1>
          <button class="pixel-button start" onclick="showScreen('age')">Get Started</button>
        </div>

        <div class="wave wave-one"></div>
        <div class="wave wave-two"></div>
        <div class="tiny-character">✦</div>
      </div>
    </section>

    <!-- LOGIN -->
    <section id="login" class="screen auth-screen">
      <div class="auth-card">
        <h2>hello !!!!</h2>
        <div class="auth-panel">
          <label>Email / username</label>
          <input type="text">
          <label>Password</label>
          <input type="password">
          <button class="pixel-button" onclick="showScreen('age')">Login</button>
        </div>
        <button class="text-link" onclick="showScreen('signup')">SignIn</button>
      </div>
      <button class="back" onclick="showScreen('home')">← Back</button>
    </section>

    <!-- SIGN UP -->
    <section id="signup" class="screen auth-screen">
      <div class="auth-card signup-card">
        <h2>hello !!!!</h2>
        <div class="auth-panel">
          <label>Email / username</label>
          <input type="text">
          <label>Password</label>
          <input type="password">
          <label>Confirm Password</label>
          <input type="password">
          <button class="pixel-button" onclick="showScreen('age')">SignIn</button>
        </div>
      </div>
      <button class="back" onclick="showScreen('home')">← Back</button>
    </section>

    <!-- AGE -->
    <section id="age" class="screen age-screen">
      <div class="grid-card">
        <button class="back-grid" onclick="showScreen('home')">←</button>
        <h2>Select age</h2>
        <div class="age-options">
          <button onclick="showScreen('game')">01–30</button>
          <button onclick="showScreen('game')">30 &amp; above</button>
        </div>
      </div>
    </section>

    <!-- GAME -->
    <section id="game" class="screen game-screen">
      <div class="game-shell">
        <button class="game-back" onclick="showScreen('age')">←</button>

        <div class="game-main">
          <div class="canvas-wrap">
            <canvas id="drawCanvas" width="560" height="410"></canvas>
          </div>

          <div class="tools">
            <button class="tool active" data-tool="pen">✎</button>
            <button class="tool" data-tool="eraser">⌫</button>
            <button class="tool" data-tool="clear">✕</button>
            <button class="tool" data-tool="undo">↶</button>
            <button class="tool" data-tool="redo">↷</button>
          </div>
        </div>

        <div class="side-panel">
          <div class="prediction">
            <span>AI THINKING</span>
            <strong id="prediction">Draw something!</strong>
          </div>
          <div class="mini-tools">
            <button>✎</button><button>□</button><button>◌</button>
          </div>
          <div class="mascot">●<br><span>◡</span></div>
        </div>

        <div class="prompt">
          <small>✦ PROMPT</small>
          <strong>Draw something amazing!</strong>
        </div>
      </div>
    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
